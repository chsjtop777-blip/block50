/* Layout: phone-first one-screen app. Home = part tabs + level list; Play = prompt / plate / thumb-zone tray / bottom action bar. */
:root{
  --bg:#e8eef3; --stud:#d9e2ea; --card:#ffffff; --ink:#1f2a37; --muted:#5d6b7a; --line:#c9d4de; --plate:#f4f7fa; --accent:#2f6fd6;
  --c-B:#2f6fd6; --c-R:#d93a2f; --c-P:#7b45c6; --c-X:#5d6670; --c-G:#228a4a; --c-O:#d0731a; --c-T:#0f7f86; --c-dot:#e6dcc8; --ink-dot:#5a4a2c;
  --p1:#2f6fd6; --p2:#5b6470; --p3:#7b45c6; --p4:#b0457f; --p5:#0f7f86; --p6:#b8620f; --p7:#228a4a; --gold:#f2b705;
  --f-display:"Jua","Gowun Dodum",system-ui,sans-serif; --f-body:"Gowun Dodum",system-ui,sans-serif; --f-brick:"Fredoka","Jua",system-ui,sans-serif;
  --gut-l:max(14px,env(safe-area-inset-left,0px)); --gut-r:max(14px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141b26; --stud:#1b2432; --card:#1f2937; --ink:#eef2f7; --muted:#a3b0c0; --line:#334155; --plate:#18212e; --accent:#6b9cf0;
  --c-dot:#d8ccb2; --ink-dot:#4a3c20; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141b26; --stud:#1b2432; --card:#1f2937; --ink:#eef2f7; --muted:#a3b0c0; --line:#334155; --plate:#18212e; --accent:#6b9cf0;
  --c-dot:#d8ccb2; --ink-dot:#4a3c20; color-scheme:dark}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
  background-image:radial-gradient(circle at 12px 12px,var(--stud) 6px,transparent 6.5px);background-size:24px 24px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,.brick:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}

/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;gap:10px;padding:10px var(--gut-r) 8px var(--gut-l);background:var(--card);border-bottom:2px solid var(--line)}
.bar h1{flex:1;min-width:0;margin:0;font-family:var(--f-display);font-weight:400;font-size:19px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar h1 em{font-style:normal;color:var(--c-R)}
.iconbtn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;border:2px solid var(--line);flex:none}
.pill{font-family:var(--f-display);font-size:15px;white-space:nowrap}
.pill b{color:var(--gold);font-weight:400}

/* ---------- home ---------- */
.home-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px var(--gut-r) calc(20px + env(safe-area-inset-bottom,0px)) var(--gut-l);display:flex;flex-direction:column;gap:12px}
.cont{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;background:var(--c-G);color:#fff;text-align:left;box-shadow:inset 0 -5px 0 rgba(0,0,0,.2)}
.cont .k{font-family:var(--f-display);font-size:14px;opacity:.9}
.cont .v{font-family:var(--f-display);font-size:20px;line-height:1.2}
.cont .go{margin-left:auto;font-size:26px}
.opts{display:grid;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--line);border-radius:14px;overflow:hidden}
.seg button{padding:10px 6px;font-family:var(--f-display);font-size:16px}
.seg button small{display:block;font-family:var(--f-body);font-size:12px;opacity:.75}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.tgls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tgl{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;border:2px solid var(--line);border-radius:14px;font-family:var(--f-display);font-size:16px}
.tgl[aria-pressed="true"]{border-color:var(--ink)}
.tgl .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--ink);display:grid;place-items:center;font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:6px 10px}
.legend span{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-display);font-size:13px;color:var(--muted)}

function burst(x,y){const n=reduce?24:70,col=FXC[Math.random()*FXC.length|0],col2=FXC[Math.random()*FXC.length|0];

  {n:4,name:'자판으로 쓰기',desc:'블록 없이 직접 문장을 써요',ico:'⌨️'}];
const TIERS=[
  {name:'스톤',from:0},{name:'브론즈',from:7},{name:'실버',from:14},{name:'골드',from:21},
  {name:'에메랄드',from:28},{name:'루비',from:35},{name:'블랙펄',from:42}];
S.tab=store.get('tab',1);S.name=store.get('name','');S.last=store.get('last2',null);

const P=lv=>S.prog[lv]||[0,0,0,0];
const cleared=()=>Object.values(S.prog).filter(a=>a[3]>0).length;
function rankOf(c){
  if(c>=50)return {t:6,name:'블랙펄 마스터',step:'★',left:0,next:null,c};
  let t=0;for(let i=0;i<TIERS.length;i++)if(c>=TIERS[i].from)t=i;
  const step=c-TIERS[t].from+1,next=TIERS[t+1],left=next?next.from-c:50-c;
  return {t,name:`${TIERS[t].name} ${step}`,step,left,next:next?next.name:'블랙펄 마스터',c};
}
const badge=(r,size='')=>`<span class="rk t${r.t} ${size}" aria-hidden="true"><b>${r.step}</b></span>`;
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
const _snap=sSnap;sSnap=()=>{_snap();buzz(12)};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}

function pips(lv){const p=P(lv);return `<span class="pips" aria-label="라운드 ${p.filter(Boolean).length}/3 완료">${p.map((s,i)=>`<i class="${s?'on':''}">${i+1}</i>`).join('')}</span>`}
function nextRound(lv){const p=P(lv);const i=p.findIndex(v=>!v);return i<0?null:i+1}
function sRank(){[392,523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,i*.1,.35,'triangle',.17));setTimeout(()=>tone(2093,0,.6,'sine',.12),750)}

    for(const k in r.prog){const a=P(k),b=r.prog[k];S.prog[k]=a.map((v,i)=>Math.max(v,b[i]))}

/* level → choose round */
function roundSheet(lv){
  const L=LESSONS[lv-1],p=P(lv),nr=nextRound(lv);
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML=`<div class="sheet" role="dialog" aria-label="${lv}단계 라운드 고르기">
    <h3>${lv}단계 · ${esc(L.title)}</h3>
    <p>①→②→③→④ 순서로 깨면 다음 라운드가 열려요.</p>
    <div class="rounds">${ROUNDS.map((R,i)=>{const lock=i>0&&!p[i-1];
      return `<button class="rbtn ${nr===R.n?'now':''}" data-r="${R.n}" ${lock?'disabled':''}>
        <span class="ri2">${lock?'🔒':R.ico}</span><span class="rt"><b>라운드 ${R.n} · ${R.name}</b><small>${R.desc}</small></span>
        <span class="st">${p[i]?starStr(p[i]):''}</span></button>`}).join('')}</div>
    <button class="act" id="close"><span>✕</span>닫기</button></div>`;
  document.body.appendChild(ov);
  ov.onclick=e=>{if(e.target===ov)ov.remove()};$('#close',ov).onclick=()=>ov.remove();
  ov.querySelectorAll('.rbtn').forEach(b=>b.onclick=()=>{ov.remove();start(lv,+b.dataset.r,0)});
}

/* ---------- game ---------- */
let cur=null;
function blocksFor(item){let b=item.b.map(([t,r])=>({t,r}));
  if(S.mode==="word")b=b.flatMap(x=>x.t.includes(' ')?x.t.split(' ').map(t=>({t,r:x.r})):[x]);return b}
function low(t){const w=t.split(' ')[0];return PROPER.has(w)?t:t.charAt(0).toLowerCase()+t.slice(1)}
function shuffled(n){const a=[...Array(n).keys()];
  for(let k=0;k<20;k++){for(let i=n-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}if(n<2||a.some((v,i)=>v!==i))break}return a}
function start(lv,r,q,order,keep){
  if(!order)order=r===1?[...Array(10).keys()]:shuffled(10); // rounds 2 and 3 mix the question order
  if(!keep)cur={lv,r,q,order,wrong:0,hints:0};else Object.assign(cur,{lv,r,q,order});
  cur.solved=false;cur.locked=false;cur.qWrong=0;
  S.last={lv,r,q,order};S.tab=partOf(lv).n;store.set('tab',S.tab);saveP();
  const L=LESSONS[lv-1],item=L.items[order[q]],p=partOf(lv);cur.item=item;
  document.body.classList.toggle('notags',!S.tags);document.body.classList.toggle('plain',r===2);
  const top=`<header class="bar"><button class="iconbtn" id="back" aria-label="단계 목록">←</button>
    <h1>${lv}단계 · <span class="rtag r${r}">${'①②③④'[r-1]} ${ROUNDS[r-1].name}</span></h1><span class="pill">${q+1}/10</span></header>
  <div class="prog"><i style="width:${q*10}%"></i></div>`;
  const prompt=`<section class="prompt"><p class="ko">${esc(item.k)}</p><span class="kw">단어 <b>${esc(item.w)}</b> = ${esc(item.m)}</span></section>`;
  if(r===3){interpScreen(top,p);return}
  if(r===4){typingScreen(top,prompt,p);return}
  const blocks=blocksFor(item);cur.blocks=blocks;
  app.innerHTML=`<div class="screen" style="--pc:var(--p${p.n})">${top}
  <main class="stage">${prompt}
    <div class="plabel"><span>${r===2?'색이 없어요! 순서를 기억해서':'순서대로 끼워요'}</span><span id="cnt"></span></div>
    <div class="plate" id="plate" aria-label="문장 만드는 판"></div>
    <div class="fb" id="fb" aria-live="polite"></div>
    <div class="tray" id="tray" aria-label="블록 상자"></div>
  </main>
  <nav class="actions" id="acts">
    <button class="act" id="reset"><span>↺</span>처음부터</button>
    <button class="act" id="hint"><span>💡</span>힌트</button>
    <button class="act" id="listen" disabled><span>🔊</span>듣기</button>
  </nav></div>`;
  const tray=$('#tray');
  shuffled(blocks.length).forEach(i=>{
    const slot=document.createElement('span');slot.className='slot';slot.dataset.i=i;
    const el=document.createElement('span');el.className='brick';el.dataset.r=blocks[i].r;el.dataset.i=i;el.tabIndex=0;
    el.dataset.base=low(blocks[i].t);el.innerHTML=`<span class="txt"></span><span class="tag">${ROLE[blocks[i].r]}</span>`;
    slot.appendChild(el);tray.appendChild(slot);setText(el,false);
    el.addEventListener('pointerdown',down);
    el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tapBrick(el)}});
  });
  requestAnimationFrame(()=>tray.querySelectorAll('.slot').forEach(s=>{const b=s.firstChild;s.style.minWidth=b.offsetWidth+'px';s.style.minHeight=b.offsetHeight+'px'}));
  $('#back').onclick=home;
  $('#reset').onclick=()=>{if(cur.solved||cur.locked)return;flip(()=>placed().forEach(returnHome))};
  $('#hint').onclick=hint;$('#listen').onclick=()=>speak(item.e);
  refresh();
}
function colored(){return cur.item.b.map(([t,r])=>`<span style="color:var(--c-${r==='.'?'X':r})">${esc(t)}</span>`).join(' ').replace(/ (<span[^>]*>(?:[.?!]|'))/g,'$1')}
function win(){
  cur.solved=true;sWin();fireworks(4);buzz([20,40,20]);
  $('#fb').innerHTML=`<div class="big ok">정답이에요! 🎉</div><div class="sent">${colored()}</div>`;
  setTimeout(()=>speak(cur.item.e),600);
  const acts=$('#acts');acts.innerHTML=`<button class="act" id="listen"><span>🔊</span>듣기</button>
    <button class="act next" id="next" style="grid-column:2/-1">${cur.q<9?'다음 문제 ▶':'라운드 완료 ▶'}</button>`;
  $('#listen').onclick=()=>speak(cur.item.e);$('#next').onclick=next;
}
function check(){
  const want=cur.blocks.map(b=>b.t.toLowerCase()),got=placed().map(el=>cur.blocks[el.dataset.i].t.toLowerCase());
  const plate=$('#plate'),fb=$('#fb');
  if(want.join('|')===got.join('|')){plate.classList.add('win');$('#tray').hidden=true;win()}
  else{
    cur.wrong++;sBoing();buzz([70,50,90]);plate.classList.remove('shake');void plate.offsetWidth;plate.classList.add('shake');
    let ok=0;while(ok<got.length&&got[ok]===want[ok])ok++;
    fb.innerHTML=`<div class="big no">띠옹~ 다시 해 봐요!</div><div class="sm">${ok?`앞에서부터 ${ok}개는 맞았어요.`:'첫 블록부터 다시 생각해 봐요.'}</div>`;
    setTimeout(()=>{flip(()=>placed().forEach(returnHome),{dur:620,ease:'cubic-bezier(.34,1.56,.64,1)',stagger:45});cur.locked=false},480);
  }
}
function hint(){
  if(cur.solved||cur.locked)return;cur.hints++;
  const want=cur.blocks.map(b=>b.t.toLowerCase()),pl=placed();
  let ok=0;while(ok<pl.length&&cur.blocks[pl[ok].dataset.i].t.toLowerCase()===want[ok])ok++;
  flip(()=>{pl.slice(ok).forEach(returnHome);
    const cand=[...$('#tray').querySelectorAll('.brick')].find(el=>cur.blocks[el.dataset.i].t.toLowerCase()===want[ok]);
    if(cand)addToPlate(cand)});
  sSnap();$('#fb').innerHTML=`<div class="sm">💡 ${ok+1}번째 블록을 끼워 줬어요.</div>`;afterChange();
}

/* ---------- round 3: typing ---------- */
const CON={"isn't":"is not","aren't":"are not","wasn't":"was not","weren't":"were not","don't":"do not","doesn't":"does not",
  "didn't":"did not","can't":"can not","cannot":"can not","won't":"will not","shouldn't":"should not","couldn't":"could not",
  "i'm":"i am","you're":"you are","we're":"we are","they're":"they are","haven't":"have not","hasn't":"has not"};
const clean=w=>w.replace(/[’‘`´]/g,"'").toLowerCase().replace(/[.?!,]/g,'');
const words=s=>s.trim().split(/\s+/).filter(Boolean);
const normW=s=>words(s).map(clean).filter(Boolean).flatMap(w=>CON[w]?CON[w].split(' '):[w]);
function typingScreen(top,prompt,p){
  app.innerHTML=`<div class="screen" style="--pc:var(--p${p.n})">${top}
  <main class="stage">${prompt}
    <div class="plabel"><span>영어 문장을 직접 써요</span><span id="wc"></span></div>
    <div class="typebox" id="tb"><textarea id="ans" rows="2" placeholder="여기에 영어로 써요" autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false" enterkeyhint="done" aria-label="영어 문장 쓰기"></textarea></div>
    <div class="skel" id="skel" aria-hidden="true">${cur.item.b.map(([t,r])=>`<i style="--c:var(--c-${r==='.'?'dot':r})"></i>`).join('')}</div>
    <div class="fb" id="fb" aria-live="polite"></div>
  </main>
  <nav class="actions" id="acts">
    <button class="act" id="hint"><span>💡</span>한 단어</button>
    <button class="act" id="peek"><span>👀</span>잠깐 보기</button>
    <button class="act next" id="ok" style="grid-column:auto">확인</button>
  </nav></div>`;
  const ta=$('#ans');
  const upd=()=>{$('#wc').textContent=`${words(ta.value).length} / ${words(cur.item.e).length} 단어`};
  ta.addEventListener('input',upd);upd();
  ta.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();typeCheck()}});
  $('#back').onclick=home;$('#ok').onclick=typeCheck;$('#hint').onclick=typeHint;$('#peek').onclick=peek;
  setTimeout(()=>{try{ta.focus({preventScroll:true})}catch(e){}},250);
}
function typeCheck(){
  if(cur.solved)return;const ta=$('#ans'),v=ta.value,fb=$('#fb');
  if(!v.trim()){fb.innerHTML='<div class="sm">문장을 먼저 써 주세요.</div>';ta.focus();return}
  const e=cur.item.e;
  if(normW(v).join(' ')===normW(e).join(' ')){
    const t=v.trim(),tips=[];
    if(t[0]!==t[0].toUpperCase())tips.push('첫 글자는 대문자');
    if(t.slice(-1)!==e.slice(-1))tips.push(`끝에는 ${e.slice(-1)}`);
    ta.readOnly=true;$('#tb').classList.add('win');win();
    if(tips.length)$('#fb').insertAdjacentHTML('beforeend',`<div class="sm">✏️ 다음엔 ${tips.join(', ')}도 챙겨요!</div>`);
    try{ta.blur()}catch(e){}
  }else{
    cur.wrong++;cur.qWrong++;sBoing();buzz([70,50,90]);
    const tb=$('#tb');tb.classList.remove('shake');void tb.offsetWidth;tb.classList.add('shake');
    const a=words(v),b=words(e);let ok=0;while(ok<a.length&&ok<b.length&&clean(a[ok])===clean(b[ok]))ok++;
    fb.innerHTML=`<div class="big no">띠옹~ 다시 써 봐요!</div><div class="sm">${ok?`앞에서부터 ${ok}단어는 맞았어요.`:'첫 단어부터 다시 생각해 봐요.'}${cur.qWrong>=2?' 어려우면 💡나 👀를 눌러요.':''}</div>`;
    ta.focus();
  }
}
function typeHint(){
  if(cur.solved)return;cur.hints++;const ta=$('#ans'),a=words(ta.value),b=words(cur.item.e);
  let ok=0;while(ok<a.length&&ok<b.length&&clean(a[ok])===clean(b[ok]))ok++;
  ta.value=b.slice(0,ok+1).join(' ')+(ok+1<b.length?' ':'');ta.dispatchEvent(new Event('input'));sSnap();
  $('#fb').innerHTML=`<div class="sm">💡 ${ok+1}번째 단어를 써 줬어요.</div>`;
  ta.focus();try{ta.setSelectionRange(ta.value.length,ta.value.length)}catch(e){}
}
function peek(){
  if(cur.solved||cur.peeking)return;cur.hints+=2;cur.peeking=true;
  $('#fb').innerHTML=`<div class="sent peek">${colored()}</div><div class="sm">3초 뒤에 사라져요. 잘 기억해요!</div>`;
  setTimeout(()=>{cur.peeking=false;if(!cur.solved)$('#fb').innerHTML='<div class="sm">기억나는 대로 써 봐요! ✍️</div>'},3000);
}

/* ---------- round / level end ---------- */
function next(){
  if(cur.q<9){start(cur.lv,cur.r,cur.q+1,cur.order,true);return}
  const lose=cur.wrong+cur.hints,stars=lose<=2?3:lose<=6?2:1,lv=cur.lv,r=cur.r;
  const before=rankOf(cleared()),p=P(lv).slice(),firstClear=r===4&&!p[3];
  p[r-1]=Math.max(p[r-1],stars);S.prog[lv]=p;
  const after=rankOf(cleared());
  S.last=r<4?{lv,r:r+1,q:0}:lv<50?{lv:lv+1,r:nextRound(lv+1)||1,q:0}:null;saveP();
  sClear();fireworks(7);buzz([30,60,30,60,80]);
  const ov=document.createElement('div');ov.className='overlay';
  const nextBtn=r<4?`<button class="act next" id="go">라운드 ${r+1} · ${ROUNDS[r].name} ▶</button>`:lv<50?`<button class="act next" id="go">${lv+1}단계로 ▶</button>`:'';
  ov.innerHTML=`<div class="sheet" role="dialog" aria-label="라운드 결과">
    <h3>${lv}단계 라운드 ${r} 완료!</h3><div class="stars">${starStr(stars)}</div>
    <p>틀린 횟수 ${cur.wrong}번 · 힌트 ${cur.hints}번</p>
    ${r<4?`<p class="nx">다음은 <b>${ROUNDS[r].name}</b>! ${ROUNDS[r].desc}.</p>`:''}
    <div class="row">${nextBtn}
      <button class="act" id="again"><span>↺</span>다시 하기</button><button class="act" id="list"><span>☰</span>단계 목록</button></div></div>`;
  document.body.appendChild(ov);
  const close=f=>()=>{ov.remove();f()};
  $('#again',ov).onclick=close(()=>start(lv,r,0));$('#list',ov).onclick=close(home);
  if($('#go',ov))$('#go',ov).onclick=close(()=>r<4?start(lv,r+1,0):start(lv+1,nextRound(lv+1)||1,0));
  if(firstClear)setTimeout(()=>promote(before,after),900);
}
function promote(a,b){
  const tierUp=b.t!==a.t||b.step==='★';
  sRank();fireworks(tierUp?12:6);buzz([40,40,40,40,160]);
  const ov=document.createElement('div');ov.className='overlay promo';
  ov.innerHTML=`<div class="promobox t${b.t} ${tierUp?'big':''}" role="dialog" aria-label="승급">
    <div class="pl">${tierUp?'새 계급 달성!':'승급!'}</div>
    <div class="pfrom">${badge(a,'md')}<span class="arrow">➜</span>${badge(b,'xl')}</div>
    <div class="pname">${b.name}</div>
    <p>${b.next?`${b.next}까지 ${b.left}단계 남았어요`:'최고 계급이에요!'}</p>
    <button class="act next" id="pok">좋아요!</button></div>`;
  document.body.appendChild(ov);$('#pok',ov).onclick=()=>ov.remove();
}

/* record code v3: 50 levels x 4 rounds x stars(0-3) */
function makeCode(){let n=0n;for(let i=50;i>=1;i--){const p=P(i);for(let j=3;j>=0;j--)n=n*4n+BigInt(p[j]||0)}
  const body=n.toString(36).toUpperCase(),sum=[...body].reduce((a,c)=>a+c.charCodeAt(0),7)%36;
  return 'B50S-'+body+'-'+sum.toString(36).toUpperCase()}
function readCode(t){t=String(t).trim().toUpperCase().replace(/\s/g,'');
  let m=t.match(/^B50([SR])-([0-9A-Z]+)-([0-9A-Z])$/);
  if(m){const sum=[...m[2]].reduce((a,c)=>a+c.charCodeAt(0),7)%36;if(sum!==parseInt(m[3],36))return null;
    const k=m[1]==='S'?4:3;let n=0n;for(const c of m[2].toLowerCase())n=n*36n+BigInt(parseInt(c,36));
    const prog={};for(let i=1;i<=50;i++){let a=[];for(let j=0;j<k;j++){a.push(Number(n%4n));n/=4n}if(k===3)a=[a[0],a[1],a[2],a[2]];if(a.some(Boolean))prog[i]=a}
    return {prog}}
  m=t.match(/^B50-([0-9A-Z]+)-([0-9A-Z])([0-9A-Z])$/); // older code: block stars only
  if(!m)return null;const lv=parseInt(m[2],36),sum=[...m[1]].reduce((a,c)=>a+c.charCodeAt(0),lv)%36;if(sum!==parseInt(m[3],36))return null;
  let n=0n;for(const c of m[1].toLowerCase())n=n*36n+BigInt(parseInt(c,36));
  const prog={};for(let i=1;i<=50;i++){const v=Number(n%4n);n/=4n;if(v)prog[i]=[v,0,0,0]}return {prog}}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){try{navigator.serviceWorker.register('sw.js')}catch(e){}}

/* ---------- round 3: interpreting (Korean chunks -> say English) ---------- */
const NUMW={'0':'zero','1':'one','2':'two','3':'three','4':'four','5':'five','6':'six','7':'seven','8':'eight','9':'nine','10':'ten','11':'eleven','12':'twelve'};
const normS=s=>normW(s).map(w=>NUMW[w]||w);
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function interpScreen(top,p){
  const it=cur.item,ch=it.b.filter(b=>b[1]!=='.'),dot=(it.b.find(b=>b[1]==='.')||[''])[0];
  cur.revealed=0;
  app.innerHTML=`<div class="screen" style="--pc:var(--p${p.n})">${top}
  <main class="stage">
    <section class="prompt"><p class="ko sm">${esc(it.k)}</p><span class="kw">단어 <b>${esc(it.w)}</b> = ${esc(it.m)}</span></section>
    <div class="plabel"><span>한글 덩어리를 차례대로 영어로 말해요</span><span id="rv"></span></div>
    <div class="cards" id="cards">${ch.map(([t,r],i)=>`<button class="ccard" data-i="${i}" style="--c:var(--c-${r})">
      <span class="kk">${esc(it.g[i])}</span><span class="ee">${esc(i===0?t:low(t))}${i===ch.length-1?esc(dot):''}</span><span class="qq">?</span></button>`).join('<span class="sl">/</span>')}</div>
    <p class="tip">소리 내어 영어로 말한 뒤 확인해요. 막히면 덩어리를 눌러 하나만 살짝 볼 수 있어요.</p>
    <div class="fb" id="fb" aria-live="polite"></div>
  </main>
  <nav class="actions" id="acts">
    <button class="act" id="mic" ${SR?'':'hidden'}><span>🎤</span>말하기</button>
    <button class="act" id="peekAll" ${SR?'':'style="grid-column:1/3"'}><span>👀</span>정답 확인</button>
    <button class="act" id="sayit"><span>🔊</span>들어 보기</button>
  </nav></div>`;
  $('#back').onclick=home;
  app.querySelectorAll('.ccard').forEach(c=>c.onclick=()=>{if(cur.solved||c.classList.contains('open'))return;
    c.classList.add('open');cur.hints++;sSnap();cur.revealed++;$('#rv').textContent=`살짝 본 덩어리 ${cur.revealed}개`});
  $('#sayit').onclick=()=>{cur.hints++;speak(it.e);$('#fb').innerHTML='<div class="sm">🔊 잘 듣고 따라 말해 봐요! (힌트 1회)</div>'};
  $('#peekAll').onclick=checkSelf;
  if(SR)$('#mic').onclick=listen;
}
function openAll(){app.querySelectorAll('.ccard').forEach((c,i)=>setTimeout(()=>c.classList.add('open'),i*110))}
function closeAll(){app.querySelectorAll('.ccard').forEach(c=>c.classList.remove('open'))}
function checkSelf(){
  if(cur.solved)return;openAll();
  $('#fb').innerHTML='<div class="sm">내가 말한 문장과 똑같았나요?</div>';
  const acts=$('#acts');acts.innerHTML=`<button class="act" id="again2"><span>🔁</span>다시 할래요</button>
    <button class="act next" id="okself" style="grid-column:2/-1">⭕ 맞게 말했어요</button>`;
  $('#okself').onclick=()=>{$('#cards').classList.add('win');win()};
  $('#again2').onclick=()=>{cur.wrong++;sBoing();buzz([70,50,90]);closeAll();
    const p=partOf(cur.lv),top=app.querySelector('.bar').outerHTML+app.querySelector('.prog').outerHTML;
    const keep=cur.revealed;interpScreen(top,p);cur.revealed=keep;
    $('#fb').innerHTML='<div class="big no">띠옹~ 한 번 더!</div><div class="sm">덩어리 순서대로 천천히 말해 봐요.</div>'};
}
let rec=null;
function listen(){
  if(cur.solved)return;
  try{rec&&rec.abort()}catch(e){}
  try{rec=new SR()}catch(e){micOff();return}
  rec.lang='en-US';rec.interimResults=false;rec.maxAlternatives=5;
  const btn=$('#mic');btn.classList.add('rec');btn.innerHTML='<span>🔴</span>듣는 중…';
  $('#fb').innerHTML='<div class="sm">영어로 말해 보세요!</div>';
  rec.onresult=e=>{const alts=[...e.results[0]].map(a=>a.transcript);const want=normS(cur.item.e).join(' ');
    if(alts.some(a=>normS(a).join(' ')===want)){$('#cards').classList.add('win');openAll();win()}
    else{cur.wrong++;sBoing();buzz([70,50,90]);
      const a=normS(alts[0]),b=normS(cur.item.e);let ok=0;while(ok<a.length&&a[ok]===b[ok])ok++;
      $('#fb').innerHTML=`<div class="big no">띠옹~ 다시 말해 봐요!</div><div class="sm">들린 말: “${esc(alts[0])}”${ok?` · 앞에서부터 ${ok}단어는 맞았어요`:''}</div>`}};
  rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'||e.error==='network')micOff(e.error);
    else $('#fb').innerHTML='<div class="sm">잘 안 들렸어요. 🎤를 다시 눌러 말해 봐요.</div>'};
  rec.onend=()=>{const b=$('#mic');if(b){b.classList.remove('rec');b.innerHTML='<span>🎤</span>말하기'}};
  try{rec.start()}catch(e){micOff()}
}
function micOff(why){const b=$('#mic');if(b)b.hidden=true;const pa=$('#peekAll');if(pa)pa.style.gridColumn='1/3';
  $('#fb').innerHTML=`<div class="sm">${why==='network'?'인터넷이 없어서 마이크 채점을 쓸 수 없어요.':'이 화면에서는 마이크를 쓸 수 없어요.'} 소리 내어 말하고 👀 정답 확인을 눌러요.</div>`}
const placed=()=>[...$('#plate').querySelectorAll('.brick')];
function setText(el,first){const b=el.dataset.base;el.querySelector('.txt').textContent=first?b.charAt(0).toUpperCase()+b.slice(1):b}
function refresh(){
  const plate=$('#plate'),pl=placed(),n=cur.blocks.length;
  pl.forEach((el,i)=>setText(el,i===0));
  $('#tray').querySelectorAll('.slot').forEach(s=>{s.classList.toggle('empty',!s.firstChild);if(s.firstChild)setText(s.firstChild,false)});
  plate.querySelectorAll('.ghost').forEach(g=>g.remove());
  for(let i=pl.length;i<n;i++){const g=document.createElement('span');g.className='ghost';plate.appendChild(g)}
  $('#cnt').textContent=`${pl.length} / ${n} 블록`;
}
function returnHome(el){const s=$(`#tray .slot[data-i="${el.dataset.i}"]`);s.appendChild(el)}
function addToPlate(el,idx){const plate=$('#plate'),pl=placed().filter(x=>x!==el);
  const ref=idx==null||idx>=pl.length?plate.querySelector('.ghost'):pl[idx];plate.insertBefore(el,ref||null)}

/* FLIP: animate every brick from where it was to where it lands */
function flip(mut,opts={}){
  const els=[...document.querySelectorAll('.brick:not(.mini)')],r0=new Map(els.map(e=>[e,e.getBoundingClientRect()]));
  mut();refresh();
  if(reduce)return;
  els.forEach((e,k)=>{const a=r0.get(e),b=e.getBoundingClientRect(),dx=a.left-b.left,dy=a.top-b.top;
    if(Math.abs(dx)+Math.abs(dy)<1)return;
    e.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],
      {duration:opts.dur||260,easing:opts.ease||'cubic-bezier(.2,.8,.3,1.2)',delay:(opts.stagger||0)*k,fill:'backwards'})});
}

/* pointer drag + tap */
let drag=null;
function down(e){
  if(cur.solved||cur.locked||e.button>0)return;
  const el=e.currentTarget;e.preventDefault();ac();
  drag={el,x0:e.clientX,y0:e.clientY,moved:false,from:el.closest('#plate')?'plate':'tray'};
  addEventListener('pointermove',move);addEventListener('pointerup',up);addEventListener('pointercancel',up);
}
function move(e){
  if(!drag)return;const {el}=drag;
  if(!drag.moved){if(Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)<6)return;
    drag.moved=true;const r=el.getBoundingClientRect();drag.dx=drag.x0-r.left;drag.dy=drag.y0-r.top;
    drag.home=el.parentNode;el.classList.add('dragging');document.body.appendChild(el);sPick();
    if(drag.from==='plate')refresh();}
  el.style.left=(e.clientX-drag.dx)+'px';el.style.top=(e.clientY-drag.dy)+'px';
  const plate=$('#plate'),over=inside(plate,e);plate.classList.toggle('over',over);
  plate.querySelectorAll('.caret').forEach(c=>c.remove());
  if(over){const i=dropIndex(e),pl=placed(),c=document.createElement('span');c.className='caret';
    plate.insertBefore(c,i<pl.length?pl[i]:plate.querySelector('.ghost'))}
}
function up(e){
  removeEventListener('pointermove',move);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);
  if(!drag)return;const {el}=drag,d=drag;drag=null;
  const plate=$('#plate');plate.classList.remove('over');plate.querySelectorAll('.caret').forEach(c=>c.remove());
  if(!d.moved){tapBrick(el);return}
  const over=inside(plate,e),idx=over?dropIndex(e):null;
  flip(()=>{el.classList.remove('dragging');el.style.left=el.style.top='';
    if(over)addToPlate(el,idx);else returnHome(el)});
  sSnap();afterChange();
}
function tapBrick(el){if(cur.solved||cur.locked)return;
  flip(()=>{if(el.closest('#plate'))returnHome(el);else addToPlate(el)});sSnap();afterChange()}
function inside(box,e){const r=box.getBoundingClientRect();return e.clientX>=r.left-10&&e.clientX<=r.right+10&&e.clientY>=r.top-24&&e.clientY<=r.bottom+10}
function dropIndex(e){const pl=placed();
  for(let i=0;i<pl.length;i++){const r=pl[i].getBoundingClientRect();
    if(e.clientY<r.top-6)return i; if(e.clientY<=r.bottom+6&&e.clientX<r.left+r.width/2)return i}
  return pl.length}
function afterChange(){if(placed().length===cur.blocks.length){cur.locked=true;setTimeout(check,280)}}

home();
</script></body></html>
